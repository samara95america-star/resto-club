apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: restaurant
  namespace: restaurant

spec:
  serviceName: restaurant-headless

  replicas: 3

  podManagementPolicy: OrderedReady

  updateStrategy:
    type: RollingUpdate

  selector:
    matchLabels:
      app: restaurant

  template:
    metadata:
      labels:
        app: restaurant

    spec:
      serviceAccountName: restaurant

      terminationGracePeriodSeconds: 30

      securityContext:
        fsGroup: 101

      containers:
        - name: restaurant

          image: 584612873567.dkr.ecr.us-east-1.amazonaws.com/resto-comp:latest

          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 80

          envFrom:
            - configMapRef:
                name: restaurant-config

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: restaurant-data
              mountPath: /data

  volumeClaimTemplates:
    - metadata:
        name: restaurant-data

      spec:
        accessModes:
          - ReadWriteOnce

        storageClassName: restaurant-gp3

        resources:
          requests:
            storage: 5Gi
